<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blinking Traffic Signal</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #eef3f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .scene {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .caption {
    margin-top: 12px;
    color: #556;
    font-size: 15px;
  }

  /* --- Light cycle timing (6s total) ---
     0%   - 50%   : GREEN on
     50%  - 60%   : YELLOW on
     60%  - 100%  : RED on
     Each active light also pulses (blinks) a couple of times while lit.
  */

  .red-core   { animation: redCycle 6s linear infinite; }
  .yellow-core{ animation: yellowCycle 6s linear infinite; }
  .green-core { animation: greenCycle 6s linear infinite; }

  @keyframes greenCycle {
    0%    { opacity: 1;    filter: drop-shadow(0 0 18px #22e05a); }
    8%    { opacity: 0.15; filter: none; }
    16%   { opacity: 1;    filter: drop-shadow(0 0 18px #22e05a); }
    24%   { opacity: 0.15; filter: none; }
    32%   { opacity: 1;    filter: drop-shadow(0 0 18px #22e05a); }
    49.9% { opacity: 1;    filter: drop-shadow(0 0 18px #22e05a); }
    50%   { opacity: 0.15; filter: none; }
    100%  { opacity: 0.15; filter: none; }
  }

  @keyframes yellowCycle {
    0%    { opacity: 0.15; filter: none; }
    50%   { opacity: 0.15; filter: none; }
    52%   { opacity: 1;    filter: drop-shadow(0 0 18px #f4c623); }
    55%   { opacity: 0.15; filter: none; }
    57%   { opacity: 1;    filter: drop-shadow(0 0 18px #f4c623); }
    59.9% { opacity: 1;    filter: drop-shadow(0 0 18px #f4c623); }
    60%   { opacity: 0.15; filter: none; }
    100%  { opacity: 0.15; filter: none; }
  }

  @keyframes redCycle {
    0%    { opacity: 0.15; filter: none; }
    60%   { opacity: 0.15; filter: none; }
    68%   { opacity: 1;    filter: drop-shadow(0 0 18px #ff3b2f); }
    76%   { opacity: 0.15; filter: none; }
    84%   { opacity: 1;    filter: drop-shadow(0 0 18px #ff3b2f); }
    99.9% { opacity: 1;    filter: drop-shadow(0 0 18px #ff3b2f); }
    100%  { opacity: 0.15; filter: none; }
  }

  @keyframes fall {
    0%   { transform: translateY(-40px); opacity: 0; }
    12%  { opacity: 0.55; }
    85%  { opacity: 0.45; }
    100% { transform: translateY(780px); opacity: 0; }
  }
  .rain { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
</style>
</head>
